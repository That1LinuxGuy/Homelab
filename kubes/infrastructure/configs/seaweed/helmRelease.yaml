apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seaweedfs
  namespace: seaweed
spec:
  interval: 30m
  chart:
    spec:
      chart: seaweedfs
      version: '4.44.0'
      sourceRef:
        kind: HelmRepository
        name: seaweed
        namespace: seaweed
      interval: 10m

  values:
    master:
      enabled: true
      replicas: 3
    volume:
      enabled: true
      replicas: 3
    filer:
      enabled: true
      replicas: 3
    csi:
      driver:
        enabled: true
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seaweedfs-csi-driver
  namespace: seaweed
spec:
  interval: 30m
  dependsOn:
    - name: seaweedfs
  chart:
    spec:
      chart: seaweedfs-csi-driver
      version: "0.2.35"
      sourceRef:
        kind: HelmRepository
        name: seaweedfs-csi-driver
        namespace: seaweed
  values:
    seaweedfsFiler: "seaweedfs-filer.seaweed.svc.cluster.local:8888"
